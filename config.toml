log_level = "INFO"

[blackwall]
image_url = "https://raw.githubusercontent.com/lexxieblack/songbird/main/assets/blackwall_banner.png"
warning_url = "https://raw.githubusercontent.com/lexxieblack/songbird/main/assets/blackwall_warning.png"

[llm]
model = "gemini-2.5-flash"
fallback_model = "gemma-4-31b-it" # Model used when primary hits daily quota limit
system_prompt_path = "prompts/system.xml"

[bot]
source_code_url = "https://github.com/lexxieblack/songbird"
help_banner_url = "https://raw.githubusercontent.com/lexxieblack/songbird/main/assets/songbird_command_index.png"

[links]
"twitter.com" = { swap = "vxtwitter.com", clean = true, chat = true, pagination = { format = "{url}/p{page}", per_page = 10 } }
"x.com" = { swap = "vxtwitter.com", clean = true, chat = true, pagination = { format = "{url}/p{page}", per_page = 10 } }
"instagram.com" = { swap = "oginstagram.com", clean = true, chat = true }
"reddit.com" = { swap = "vxreddit.com", clean = true, chat = true }
"tiktok.com" = { swap = "d.tiktokez.com", follow = true, clean = true, chat = true }
"youtube.com" = { clean = true, clean_exceptions = ["t", "v", "list"] }
"youtu.be" = { clean = true, clean_exceptions = ["t", "v", "list"] }
"facebook.com" = { swap = "facebed.com", clean = true, clean_exceptions = [
    "fbid"
], chat = true }
"threads.com" = { swap = "fixthreads.seria.moe", chat = true }
"*" = { clean = true }
